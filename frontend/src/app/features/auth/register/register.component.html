<div class="register-page">
  <div class="register-card">
    <h2 class="register-title">Dyve Mall</h2>
    <p class="register-subtitle">Créer votre compte</p>

    <form (ngSubmit)="onSubmit()" class="register-form">

      <div class="form-group">
        <label class="form-label">Nom</label>
        <input type="text" [(ngModel)]="nom" name="nom" required
          class="form-input" placeholder="Ma Super Boutique" />
      </div>

      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" [(ngModel)]="mail" name="mail" required
          class="form-input" placeholder="contact@exemple.mg" />
      </div>

      <div class="form-group">
        <label class="form-label">Mot de passe</label>
        <input type="password" [(ngModel)]="mdp" name="mdp" required
          class="form-input" placeholder="••••••••" />
      </div>

      <div class="form-group">
        <label class="form-label">Type de commerce</label>
        <select [(ngModel)]="typeCommerce" name="typeCommerce" class="form-input form-select">
          <option value="client">Client</option>
          <option value="tech">Technologie / High-Tech</option>
          <option value="mode">Mode & Accessoires</option>
          <option value="alimentation">Alimentation</option>
          <option value="beauté">Beauté & Cosmétique</option>
          <option value="services">Services</option>
          <option value="autre">Autre</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Description <span class="form-label--optional">(facultatif)</span></label>
        <textarea [(ngModel)]="description" name="description" rows="3"
          class="form-input form-textarea"
          placeholder="Décrivez brièvement votre activité..."></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">Téléphone de contact</label>
        <input type="tel" [(ngModel)]="numero" name="numero"
          class="form-input" placeholder="034 12 345 67" />
      </div>

      <button type="submit" [disabled]="isLoading" class="btn-submit">
        {{ isLoading ? 'Création en cours...' : 'Créer mon compte' }}
      </button>

      @if (successMessage) {
        <div class="success-message">{{ successMessage }}</div>
      }

      @if (errorMessage) {
        <div class="error-message">{{ errorMessage }}</div>
      }

    </form>

    <div class="register-footer">
      <p>Déjà inscrit ?</p>
      <a routerLink="/login">Se connecter →</a>
    </div>
  </div>
</div>
