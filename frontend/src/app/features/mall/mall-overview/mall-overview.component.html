<div class="mall-canvas-wrapper">
  <div class="pixi-container">

    <app-mall-map
      *ngIf="!showInteriorView"
      [types]="types"
      [boxs]="boxs"
      [boutiques]="boutiques"
      [contrats]="contrats"
      [editMode]="editMode"                    
      (selectBox)="enterInteriorView($event)"
      (editBox)="onEditBox($event)"            
    ></app-mall-map>

    <app-box-interior
      *ngIf="showInteriorView && selectedBox && selectedType"
      [box]="selectedBox!"
      [type]="selectedType!"
      [contrat]="selectedContrat"
      [boutique]="selectedBoutique"
      (back)="returnToMap()"
    ></app-box-interior>

  </div>

  <button 
    class="fab-edit" 
    mat-fab 
    color="primary" 
    (click)="toggleEditMode()"
    matTooltip="{{ editMode ? 'Quitter le mode édition' : 'Modifier les boxes' }}"
  >
    <mat-icon>{{ editMode ? 'close' : 'edit' }}</mat-icon>
  </button>
</div>
